name: Validate site

on:
  push:
    branches: [codex/yclients-metrika]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - name: Check modified TypeScript files
        run: bun x eslint src/app/layout.tsx src/app/page.tsx src/components/site/yclients-booking.tsx src/app/api/bookings/route.ts src/app/api/bookings/taken/route.ts
      - run: bun run build
      - run: bun x tsc --noEmit
